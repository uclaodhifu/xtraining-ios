name: XTraining
options:
  bundleIdPrefix: com.xtraining
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    APP_BUNDLE_ID: com.kaigreen.xtraining
targets:
  XTraining:
    type: application
    platform: iOS
    sources: [XTraining, Shared]
    dependencies:
      - target: XTrainingWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: XTraining
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
    entitlements:
      path: XTraining/XTraining.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: XTraining/Info.plist
      properties:
        CFBundleDisplayName: X Training
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBG
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.kaigreen.xtraining.card
            UTTypeDescription: X Training 动作卡片
            UTTypeConformsTo: [public.data]
        NSHealthShareUsageDescription: 读取你在 Apple 健康里的运动、消耗的卡路里和步数，显示在“我”的运动记录日历里。
        NSHealthUpdateUsageDescription: X Training 目前不会往 Apple 健康里写数据。
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSSupportsLiveActivities: true
        LSApplicationQueriesSchemes: [snssdk1128]
  XTrainingWidgets:
    type: app-extension
    platform: iOS
    sources: [XTrainingWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        PRODUCT_NAME: XTrainingWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
    info:
      path: XTrainingWidgets/Info.plist
      properties:
        CFBundleDisplayName: X Training
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
