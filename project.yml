name: XTraining
options:
  bundleIdPrefix: com.xtraining
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    APP_BUNDLE_ID: com.kaigreen.xtraining
targets:
  XTraining:
    type: application
    platform: iOS
    sources: [XTraining, Shared]
    dependencies:
      - target: XTrainingWidgets
    scheme:
      testTargets: [XTrainingTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: XTraining
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
    entitlements:
      path: XTraining/XTraining.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: XTraining/Info.plist
      properties:
        CFBundleDisplayName: X Training
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBG
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.kaigreen.xtraining.card
            UTTypeDescription: X Training 动作卡片
            UTTypeConformsTo: [public.data]
        NSPhotoLibraryUsageDescription: 从相册选一段做动作的视频分析阻力曲线（视频不会上传）；或选一张健身房照片上传到打卡地球。
        NSLocationWhenInUseUsageDescription: 用来找你附近的健身房、给新健身房定位。只上传你选中的健身房，不上传你的个人位置。
        NSCameraUsageDescription: 录一段做动作的视频分析阻力曲线（视频不会上传）；或拍一张健身房照片上传到打卡地球。
        NSMicrophoneUsageDescription: 录视频时系统会一起录声音，X Training 不会使用也不会上传。
        NSHealthShareUsageDescription: 读取你在 Apple 健康里的运动、消耗的卡路里、步数和心率，显示在“我”的运动记录日历和心率档案里，并在组间休息时看心率恢复。
        NSHealthUpdateUsageDescription: 训练时用耳机或手表测心率，练完会把这次力量训练（时长、心率、消耗）存进 Apple 健康。
        NSBluetoothAlwaysUsageDescription: 连接开着“心率广播”的手环或心率带，训练时显示实时心率，心率降下来就提醒你开下一组。
        UIBackgroundModes: [bluetooth-central]
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSSupportsLiveActivities: true
        LSApplicationQueriesSchemes: [snssdk1128, iosamap]
  XTrainingWidgets:
    type: app-extension
    platform: iOS
    sources: [XTrainingWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        PRODUCT_NAME: XTrainingWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
    info:
      path: XTrainingWidgets/Info.plist
      properties:
        CFBundleDisplayName: X Training
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  XTrainingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [XTrainingTests]
    dependencies:
      - target: XTraining
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
