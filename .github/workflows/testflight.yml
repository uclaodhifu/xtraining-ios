# 云端用 Mac 编译 X Training，并上传到 TestFlight（不需要自己有 Mac）
name: TestFlight

on:
  workflow_dispatch:      # 只手动触发：在 Actions 页面点 “Run workflow” 才编译、上传 TestFlight

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APP_BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.kaigreen.xtraining' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: 选最新的 Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: 生成 Xcode 工程
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 准备 App Store Connect 密钥
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          sed -i '' "s/__TEAM_ID__/$TEAM_ID/" ExportOptions.plist

      - name: 清理旧的开发证书（避免证书数量满了）
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet --user pyjwt cryptography
          python3 .github/scripts/cleanup_dev_certs.py

      - name: 编译打包
        run: |
          xcodebuild archive \
            -project XTraining.xcodeproj -scheme XTraining \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/XTraining.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" APP_BUNDLE_ID="$APP_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: 上传到 TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/XTraining.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: 自动分发（测试说明 + 测试群组 + 外部审核）
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
          BUILD_NO: ${{ github.run_number }}
          BEFORE: ${{ github.event.before }}
        run: |
          # 优先用中文更新说明（testflight-notes.txt，每次发版前写好）
          if [ -s testflight-notes.txt ]; then
            NOTES=$(cat testflight-notes.txt)
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            NOTES=$(git log --no-merges --pretty='• %s' "$BEFORE..HEAD" | head -15)
          else
            NOTES=$(git log --no-merges --pretty='• %s' -1)
          fi
          export NOTES
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet --user pyjwt cryptography
          python3 .github/scripts/testflight_distribute.py

      - name: 清理密钥
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
