name: ML 训练器械识别模型
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-2l3bya]
    paths: ['ml/exclude.txt']
permissions:
  contents: write
  actions: read
jobs:
  train:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 下载照片
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: gh run download "$(cat ml/review/collect_run_id.txt)" -n machine-photos -D ml/data -R "${{ github.repository }}"
      - run: python3 ml/split.py
      - run: swift ml/train.swift
      - name: 提交模型和报告
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add ml/out && git commit -m "ml: trained model (run ${{ github.run_id }})" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
