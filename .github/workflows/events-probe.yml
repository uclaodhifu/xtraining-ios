name: 赛事抓取试跑（临时）
on:
  push:
    branches: [claude/project-thread-nhmzni]
    paths: ['events-probe/**', '.github/workflows/events-probe.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cd events-probe && python3 scripts/build.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -f events-probe/public events-probe/data
          git commit -m "试跑结果" && git push
