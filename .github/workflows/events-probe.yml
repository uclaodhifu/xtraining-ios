name: 赛事抓取试跑（临时）
on:
  push:
    branches: [claude/project-thread-nhmzni]
    paths: ['events-probe/**', '.github/workflows/events-probe.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cd events-probe && python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: |
            events-probe/data/raw-musclegame.json
            events-probe/public/events.json
