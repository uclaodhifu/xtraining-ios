# 免费：云端用 Mac 编译出没签名的 XTraining.ipa，再用 Windows 上的 Sideloadly 装到手机
name: 编译安装包

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 选最新的 Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: 生成 Xcode 工程
        run: |
          brew install xcodegen
          xcodegen generate
      - name: 编译
        run: |
          xcodebuild build \
            -project XTraining.xcodeproj -scheme XTraining \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: 打包成 ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/XTraining.app Payload/
          # 临时签名，把 HealthKit 权限写进去，Sideloadly 自签时会带上
          codesign -f -s - --entitlements XTraining/XTraining.entitlements Payload/XTraining.app
          codesign -d --entitlements - Payload/XTraining.app
          zip -qry XTraining.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: XTraining-ipa
          path: XTraining.ipa
          retention-days: 30
      - name: 发布到 Releases（方便直接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: X Training 测试版 ${{ github.run_number }}
          body: 未签名安装包，用 Sideloadly 或 爱思助手 自签安装。
          files: XTraining.ipa
          make_latest: true
