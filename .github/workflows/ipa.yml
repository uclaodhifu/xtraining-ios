# 免费：云端用 Mac 编译出没签名的 XTraining.ipa，再用 Windows 上的 Sideloadly 装到手机
name: 编译安装包

on:
  workflow_dispatch:      # 只手动跑（省云端时间）；推送 main 时 TestFlight 那边已经会编译

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 选最新的 Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: 生成 Xcode 工程
        run: |
          brew install xcodegen
          xcodegen generate
      - name: 跑单元测试（模拟器）
        run: |
          set -o pipefail
          ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test -project XTraining.xcodeproj -scheme XTraining -destination "id=$ID" \
            -derivedDataPath build-test CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log \
            | grep -E "error:|Test Case .*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: 编译
        run: |
          xcodebuild build \
            -project XTraining.xcodeproj -scheme XTraining \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: 打包成 ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/XTraining.app Payload/
          # 先签小组件（锁屏/灵动岛休息计时），再签 App
          for x in Payload/XTraining.app/PlugIns/*.appex; do [ -d "$x" ] && codesign -f -s - "$x"; done
          # 临时签名，把 HealthKit 权限写进去，Sideloadly 自签时会带上
          codesign -f -s - --entitlements XTraining/XTraining.entitlements Payload/XTraining.app
          codesign -d --entitlements - Payload/XTraining.app
          echo '--- App Info.plist ---'; plutil -p Payload/XTraining.app/Info.plist
          for x in Payload/XTraining.app/PlugIns/*.appex; do echo "--- $x ---"; plutil -p "$x/Info.plist"; codesign -d --entitlements - "$x"; done
          # 用苹果自带的 ditto 打包（有的签名 App 认不了 zip 命令打的包）
          ditto -c -k --norsrc --noextattr --keepParent Payload XTraining.ipa
          cp XTraining.ipa "XTraining-${{ github.run_number }}.ipa"
          unzip -tq XTraining.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: XTraining-ipa
          path: XTraining.ipa
          retention-days: 1
      - name: 先推标签（GitHub 偶尔建标签时报 500）
        run: |
          git tag -f build-${{ github.run_number }}
          git push -f origin build-${{ github.run_number }} || true
      - name: 发布到 Releases（方便直接下载）
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: X Training 测试版 ${{ github.run_number }}
          body: 未签名安装包，用 Sideloadly 或 爱思助手 自签安装。
          files: |
            XTraining.ipa
            XTraining-${{ github.run_number }}.ipa
          make_latest: true
      - name: 确保版本已公开（GitHub 偶尔停在草稿）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=build-${{ github.run_number }}
          gh release view "$T" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$T" -R "$GITHUB_REPOSITORY" --title "X Training 测试版 ${{ github.run_number }}" --notes "未签名安装包，用 Sideloadly 或 爱思助手 自签安装。" || true
          for i in 1 2 3 4 5; do
            gh release upload "$T" XTraining.ipa "XTraining-${{ github.run_number }}.ipa" -R "$GITHUB_REPOSITORY" --clobber && break
            sleep 15
          done
          for i in 1 2 3 4 5; do
            gh release edit "$T" -R "$GITHUB_REPOSITORY" --draft=false --latest && break
            sleep 15
          done
          gh release view "$T" -R "$GITHUB_REPOSITORY" --json isDraft,assets --jq '{isDraft, assets: [.assets[].name]}'
          # 清掉以前失败留下的草稿
          gh release list -R "$GITHUB_REPOSITORY" --limit 30 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' | while read t; do
            [ "$t" != "$T" ] && gh release delete "$t" -R "$GITHUB_REPOSITORY" -y || true
          done
